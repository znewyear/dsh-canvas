name: Bug report
description: 报告可复现的问题（安全漏洞请遵循 SECURITY.md）
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: DSH、Node.js、操作系统及浏览器/桌面端版本。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: 最小复现步骤、预期结果与实际结果。请勿上传凭据或私人画布。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and screenshots
      description: 可选的脱敏日志、截图以及已执行的检查。
