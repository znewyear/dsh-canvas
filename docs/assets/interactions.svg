<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title"><title id="title">Engine-verified erasure, undo and human approval transitions; explanatory diagrams, not UI screenshots</title><rect width="1600" height="980" rx="24" fill="#f4f5ef"/><g font-family="Segoe UI,Arial,sans-serif"><text x="64" y="69" font-size="15" fill="#24745c">DSH CANVAS  /  INTERACTION NOTES</text><text x="60" y="134" font-size="40" fill="#203b36">Edits you can explain. Decisions you control.</text><text x="64" y="183" font-size="19" fill="#687c74">Actual document transitions, presented as diagrams — not application screenshots.</text><rect x="64" y="235" width="472" height="285" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="88" y="278" font-size="14" fill="#24745c">01 / DRAW</text><path d="M114,380 L174,330 L234,385 L294,335 L354,390 L414,325 L474,375" fill="none" stroke="#24745c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="468" font-size="18" fill="#203b36">One continuous stroke</text><text x="88" y="498" font-size="13" fill="#687c74">Document v1</text><rect x="564" y="235" width="472" height="285" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="588" y="278" font-size="14" fill="#24745c">02 / ERASE</text><path d="M614,380 L674,330 L734,385 L765,359.1666666666667" fill="none" stroke="#24745c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M823,361.5833333333333 L854,390 L914,325 L974,375" fill="none" stroke="#24745c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="588" y="468" font-size="18" fill="#203b36">Local fragments, not a full deletion</text><text x="588" y="498" font-size="13" fill="#687c74">Document v2</text><rect x="1064" y="235" width="472" height="285" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="1088" y="278" font-size="14" fill="#24745c">03 / UNDO</text><path d="M1114,380 L1174,330 L1234,385 L1294,335 L1354,390 L1414,325 L1474,375" fill="none" stroke="#24745c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="1088" y="468" font-size="18" fill="#203b36">The original stroke returns</text><text x="1088" y="498" font-size="13" fill="#687c74">Document v3</text><text x="64" y="581" font-size="29" fill="#203b36">Approval is an explicit boundary.</text><rect x="64" y="616" width="472" height="250" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="88" y="660" font-size="22" fill="#203b36">01 / AI proposes a card</text><text x="88" y="702" font-size="16" fill="#687c74">The circle remains unchanged.</text><ellipse cx="139" cy="779" rx="38" ry="29" fill="#e5eee5" stroke="#24745c" stroke-width="2"/><text x="204" y="786" font-size="14" fill="#24745c">PENDING / OPEN</text><rect x="564" y="616" width="472" height="250" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="588" y="660" font-size="22" fill="#203b36">02 / AI approval is refused</text><text x="588" y="702" font-size="16" fill="#687c74">FORBIDDEN — no partial mutation.</text><ellipse cx="639" cy="779" rx="38" ry="29" fill="#e5eee5" stroke="#24745c" stroke-width="2"/><text x="704" y="786" font-size="14" fill="#24745c">VERSION UNCHANGED</text><rect x="1064" y="616" width="472" height="250" rx="18" fill="#fffef9" stroke="#d6dfd7"/><text x="1088" y="660" font-size="22" fill="#203b36">03 / A human approves</text><text x="1088" y="702" font-size="16" fill="#687c74">The element becomes a card.</text><rect x="1101" y="750" width="76" height="58" rx="10" fill="#e5eee5" stroke="#24745c" stroke-width="2"/><text x="1204" y="786" font-size="14" fill="#24745c">RESOLVED BY / HUMAN</text><text x="64" y="925" font-size="14" fill="#687c74">Engine-verified examples  /  Reproduce with node scripts/create-interactions.mjs</text></g></svg>
